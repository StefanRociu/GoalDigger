{% extends 'base.html' %}
{% block title %}Edit {{ sport.name }} — GoalDigger{% endblock %}

{% block content %}
<div class="px-4 pt-6">
    <a href="{{ url_for('sport_detail', sport_id=sport.id) }}"
        class="inline-flex items-center gap-1.5 text-sm text-slate-500 mb-6">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        {{ sport.name }}
    </a>

    <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 flex items-center justify-center text-2xl">
            {{ sport.icon }}
        </div>
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Edit {{ sport.name }}</h1>
            <p class="text-slate-400 text-sm">{{ kid.name }}</p>
        </div>
    </div>

    <form method="POST" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">
                When did {{ kid.name }} start {{ sport.name }}?
                <span class="text-slate-400 font-normal">(optional)</span>
            </label>
            <input type="date" name="started_date"
                value="{{ sport.started_date.isoformat() if sport.started_date else '' }}" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 text-base
                    focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" />
            <p class="text-xs text-slate-400 mt-1.5">Helps the AI understand their experience level.</p>
        </div>

        <div class="pt-2">
            <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white
                     font-semibold py-3.5 rounded-xl transition text-base">
                Save changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
