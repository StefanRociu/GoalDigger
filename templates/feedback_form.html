{% extends 'base.html' %}
{% block title %}Feedback — GoalDigger{% endblock %}

{% block content %}
<div class="px-4 pt-6">
    <a href="{{ url_for('dashboard') }}" class="inline-flex items-center gap-1.5 text-sm text-slate-500 mb-6">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Back
    </a>

    <h1 class="text-2xl font-bold text-slate-800 mb-1">Share feedback</h1>
    <p class="text-slate-400 text-sm mb-6">Tell us what's working, what's broken, or what you'd like to see.</p>

    <form method="POST" class="space-y-5">

        <!-- Category -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-3">What kind of feedback?</label>
            <div class="space-y-2">
                {% for value, label in categories %}
                <label
                    class="flex items-center gap-3 p-3.5 rounded-xl border-2 border-slate-100 bg-white cursor-pointer
                      hover:border-indigo-200 hover:bg-indigo-50 transition has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                    <input type="radio" name="category" value="{{ value }}" class="accent-indigo-500" {% if loop.first
                        %}checked{% endif %} />
                    <span class="text-sm font-medium text-slate-700">{{ label }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- Message -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Your message <span
                    class="text-red-400">*</span></label>
            <textarea name="message" required rows="5" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 text-base
                       focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent
                       placeholder-slate-300 resize-none" placeholder="Be as detailed as you like…"></textarea>
        </div>

        <div class="pt-1">
            <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 text-white
                     font-semibold py-3.5 rounded-xl transition text-base">
                Send feedback
            </button>
        </div>
    </form>
</div>
{% endblock %}
